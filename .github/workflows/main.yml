name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Clarinet
        uses: hirosystems/setup-clarinet@v1
        with:
          version: '2.4.1'

      - name: Check contracts
        run: |
          cd contracts
          clarinet check

      - name: Run contract tests
        run: |
          cd contracts
          npm ci
          clarinet test
